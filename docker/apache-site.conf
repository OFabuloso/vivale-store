<VirtualHost *:80>
  DocumentRoot /home/u151095779/domains/vivalestore.com.br/public_html

  <Directory /home/u151095779/domains/vivalestore.com.br/public_html>
    AllowOverride All
    Require all granted
  </Directory>

  # Na Hostinger o site é HTTPS; aqui simulamos isso para o .htaccess não redirecionar
  RequestHeader set X-Forwarded-Proto "https" early

  ErrorLog ${APACHE_LOG_DIR}/error.log
  CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
