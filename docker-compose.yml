# Ambiente local do backend (só para desenvolvimento e testes).
# Uso: docker compose up -d --build   →   http://localhost:8081
# O banco começa com as tabelas e o catálogo de api/sql/ e um usuário de teste.
services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8081:80"
    # Mesma pasta da Hostinger, para rodar "php ferramentas/..." direto
    working_dir: /home/u151095779/domains/vivalestore.com.br/public_html
    volumes:
      - ./:/home/u151095779/domains/vivalestore.com.br/public_html
      - ./docker/dev/config:/home/u151095779/domains/vivalestore.com.br/config:ro
      - ./docker/dev/.htpasswd:/home/u151095779/domains/vivalestore.com.br/.htpasswd:ro
      - uploads:/home/u151095779/domains/vivalestore.com.br/uploads
    depends_on:
      - banco

  banco:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: vivale
      MARIADB_USER: vivale
      MARIADB_PASSWORD: vivale-local
      MARIADB_ROOT_PASSWORD: vivale-root-local
    volumes:
      - ./api/sql:/docker-entrypoint-initdb.d:ro
      - banco:/var/lib/mysql

volumes:
  uploads:
  banco:
